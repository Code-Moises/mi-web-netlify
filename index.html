  <head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-body text-center">
          <img src="./images/foto.jpg" class="rounded-circle mb-3" alt="Foto Perfil" style="width: 150px; height: 150px; object-fit: cover;">
          
          <h1 class="card-title">Nombre: Moisés Becerra</h1>
          <p class="card-text text-muted">Desarrollador Web | Estudiante</p>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-md-6">
            <h3>Experiencia</h3>
            <ul class="list-group">
                <li class="list-group-item">Práctica Netlify - 2024</li>
                <li class="list-group-item">Desarrollo Web Full Stack</li>
            </ul>
        </div>
        <div class="col-md-6">
            <h3>Habilidades</h3>
            <span class="badge bg-primary">HTML</span>
            <span class="badge bg-secondary">Docker</span>
            <span class="badge bg-success">Netlify</span>
        </div>
      </div>

      <hr class="my-5">

<hr class="my-5">

<div class="card shadow">
  <div class="card-body">
    <h3 class="text-center mb-4">Contacto</h3>

    <form name="contacto" method="POST" data-netlify="true">
      
      <!-- Campo oculto obligatorio para Netlify -->
      <input type="hidden" name="form-name" value="contacto">

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mensaje</label>
        <textarea name="mensaje" class="form-control" rows="4" required></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary">
          Enviar mensaje
        </button>
      </div>

    </form>
  </div>
</div>
